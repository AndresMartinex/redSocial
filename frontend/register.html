<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/register.css">
  <title>RedSocial — Registro</title>
</head>
<body>

  <div class="register-box">

    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="6" r="3" fill="#185fa5"/>
        <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <h2>Crear cuenta</h2>
    <p>Únete a la red. Es gratis y siempre lo será.</p>

    <div id="error-msg" style="color:red; display:none;"></div>
    <div id="success-msg" style="color:green; display:none;"></div>

    <form id="signup-form">

      <div class="section-label">Datos personales</div>

      <div class="row">
        <div class="field">
          <label for="nombre">Nombre(s)</label>
          <input type="text" id="nombre" name="name" placeholder="Juan">
        </div>
        <div class="field">
          <label for="apellido">Apellidos</label>
          <input type="text" id="apellido" name="lastName" placeholder="Pérez">
        </div>
      </div>

      <div class="field">
        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario" name="username" placeholder="@juanperez">
      </div>

      <div class="field">
        <label for="nacimiento">Fecha de nacimiento</label>
        <input type="date" id="nacimiento" name="birthDate">
      </div>

      <div class="field">
        <label for="genero">Género</label>
        <select id="genero" name="gender">
          <option value="" disabled selected>Selecciona una opción</option>
          <option>Masculino</option>
          <option>Femenino</option>
          <option>No binario</option>
          <option>Prefiero no decirlo</option>
        </select>
      </div>

      <hr class="divider">
      <div class="section-label">Cuenta</div>

      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="email" placeholder="tuemail@ejemplo.com">
      </div>

      <div class="row">
        <div class="field">
          <label for="pass">Contraseña</label>
          <input type="password" id="pass" name="password" placeholder="••••••••">
          <!-- Indicador de requisitos -->
          <ul id="pass-rules" style="font-size:0.78rem; margin-top:6px; padding-left:18px; color:#888;">
            <li id="rule-length">Mínimo 8 caracteres</li>
            <li id="rule-number">Al menos un número</li>
          </ul>
        </div>
        <div class="field">
          <label for="pass2">Confirmar</label>
          <input type="password" id="pass2" name="passwordConfirm" placeholder="••••••••">
          <span id="match-msg" style="font-size:0.78rem; display:none;"></span>
        </div>
      </div>

      <button type="submit" class="btn">Crear cuenta</button>

    </form>

    <p class="terms">
      Al registrarte aceptas los <a href="#">Términos de servicio</a>
      y la <a href="#">Política de privacidad</a>.
    </p>

    <a href="login.html" class="login-link">¿Ya tienes cuenta? <span>Inicia sesión</span></a>

  </div>

<script>
  const passInput = document.getElementById('pass');
  const pass2Input = document.getElementById('pass2');
  const ruleLength = document.getElementById('rule-length');
  const ruleNumber = document.getElementById('rule-number');
  const matchMsg = document.getElementById('match-msg');

  // Validación en tiempo real de requisitos
  passInput.addEventListener('input', () => {
    const val = passInput.value;

    if (val.length >= 8) {
      ruleLength.style.color = 'green';
      ruleLength.textContent = '✔ Mínimo 8 caracteres';
    } else {
      ruleLength.style.color = '#e74c3c';
      ruleLength.textContent = '✘ Mínimo 8 caracteres';
    }

    if (/[0-9]/.test(val)) {
      ruleNumber.style.color = 'green';
      ruleNumber.textContent = '✔ Al menos un número';
    } else {
      ruleNumber.style.color = '#e74c3c';
      ruleNumber.textContent = '✘ Al menos un número';
    }

    checkMatch();
  });

  // Validación de coincidencia
  pass2Input.addEventListener('input', checkMatch);

  function checkMatch() {
    const match = passInput.value === pass2Input.value && pass2Input.value !== '';
    matchMsg.style.display = pass2Input.value ? 'block' : 'none';
    matchMsg.textContent = match ? '✔ Las contraseñas coinciden' : '✘ Las contraseñas no coinciden';
    matchMsg.style.color = match ? 'green' : '#e74c3c';
  }

  function isPasswordValid(password) {
    return password.length >= 8 && /[0-9]/.test(password);
  }

  document.getElementById('signup-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    const password = document.getElementById('pass').value;
    const passwordConfirm = document.getElementById('pass2').value;

    // Validación antes de enviar al backend
    if (!isPasswordValid(password)) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'La contraseña debe tener al menos 8 caracteres y un número.';
      return;
    }

    if (password !== passwordConfirm) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'Las contraseñas no coinciden.';
      return;
    }

    const body = {
      name: document.getElementById('nombre').value,
      lastName: document.getElementById('apellido').value,
      username: document.getElementById('usuario').value,
      birthDate: document.getElementById('nacimiento').value,
      gender: document.getElementById('genero').value,
      email: document.getElementById('correo').value,
      password,
      passwordConfirm
    };

    try {
      const response = await fetch('http://localhost:8080/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (response.ok) {
        successMsg.style.display = 'block';
        successMsg.textContent = 'Cuenta creada exitosamente. Redirigiendo...';
        setTimeout(() => window.location.href = 'login.html', 2000);
      } else {
        errorMsg.style.display = 'block';
        errorMsg.textContent = data.error || 'Error al crear la cuenta';
      }

    } catch (error) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'Error de conexión con el servidor';
    }
  });
</script>

</body>
</html>
