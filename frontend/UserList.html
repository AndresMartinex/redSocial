<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedSocial — Usuarios</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">RedSocial</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="profile.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="#">Añadir amigos</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Más</a>
            <ul class="dropdown-menu">
              
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="login.html">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex gap-2" action="/user/list" method="get">
          <input class="form-control" type="search" name="searchText"
                 th:placeholder="#{Placeholder.user.list.search}"
                 placeholder="Buscar usuarios...">
          <button class="btn-search" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- CABECERA -->
    <div class="users-header">
      <div>
        <h2 class="users-title" th:text="#{Title.user.list}">Usuarios</h2>
      </div>
    </div>

    <!-- LISTA -->
    <div th:fragment="tableUsersAndPagination" id="tableUsersAndPagination">

      <!-- Sin resultados -->
      <div class="empty-state" th:if="${#lists.isEmpty(usersList)}">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="15" r="7" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
          <path d="M6 36c0-7.732 6.268-14 14-14s14 6.268 14 14"
                stroke="#b4b2a9" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
        <p>No se encontraron usuarios</p>
        <span>Intenta con otro término de búsqueda</span>
      </div>

      <!-- Tarjetas -->
      <div class="users-grid" th:if="${not #lists.isEmpty(usersList)}">
        <div class="user-card" th:each="user : ${usersList}">

      <!-- Paginación -->
      <div th:replace="fragments/pagination"></div>

    </div>

  </div><!-- /container -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
