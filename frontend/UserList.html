<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedSocial — Usuarios</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/profile.css">
  
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">RedSocial</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="profile.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="UserList.html">Añadir amigos</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Más</a>
            <ul class="dropdown-menu">
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="login.html">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex gap-2" id="search-form">
          <input class="form-control" type="search" id="searchText" placeholder="Buscar usuarios...">
          <button class="btn-search" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <div id="error-msg" class="alert alert-danger" style="display:none;"></div>
    <div id="success-msg" class="alert alert-success" style="display:none;"></div>

    <div class="main-grid">

      <!-- Columna izquierda: usuarios + amigos -->
      <div>
        <h2 class="users-title">Usuarios</h2>
        <div class="empty-state" id="empty-state" style="display:none;">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="15" r="7" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
            <path d="M6 36c0-7.732 6.268-14 14-14s14 6.268 14 14"
                  stroke="#b4b2a9" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </svg>
          <p>No se encontraron usuarios</p>
          <span>Intenta con otro término de búsqueda</span>
        </div>
        <div id="users-grid"></div>

        <h2 class="users-title mt-4">Amigos</h2>
        <div id="friends-grid">
          <p class="empty-text">No tienes amigos añadidos aún.</p>
        </div>
      </div>

      <!-- Columna derecha: solicitudes -->
      <div>
        <h2 class="users-title">Solicitudes de amistad</h2>
        <div id="requests-grid">
          <p class="empty-text">No tienes solicitudes pendientes.</p>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const userData = JSON.parse(localStorage.getItem('user'));
    if (!userData) { window.location.href = 'login.html'; }

    const senderId = userData?.id ?? null;
    const email    = userData?.email ?? localStorage.getItem('email');

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    // ── USUARIOS ──────────────────────────────────────────────
    async function loadUsers(search = '') {
      try {
        const url = search
          ? `http://localhost:8080/api/auth/listar?search=${encodeURIComponent(search)}`
          : `http://localhost:8080/api/auth/listar`;
        const response = await fetch(url);
        if (!response.ok) throw new Error();
        renderUsers(await response.json());
      } catch {
        showError('Error de conexión con el servidor');
      }
    }

    function renderUsers(users) {
      const grid       = document.getElementById('users-grid');
      const emptyState = document.getElementById('empty-state');
      grid.innerHTML   = '';

      const filtered = users.filter(u => u.id !== senderId);

      if (!filtered.length) {
        emptyState.style.display = 'flex';
        return;
      }
      emptyState.style.display = 'none';

      filtered.forEach(user => {
        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `
          <span class="user-name">${user.name} ${user.lastName}</span>
          <button class="btn-add-friend"
            onclick="sendInvitation(${senderId}, ${user.id}, this)">
            Añadir amigo
          </button>`;
        grid.appendChild(card);
      });
    }

    async function sendInvitation(sid, receiverId, btn) {
      try {
        btn.disabled    = true;
        btn.textContent = 'Enviando...';
        const response  = await fetch('http://localhost:8080/api/invitations/crear', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ senderId: sid, receiverId })
        });
        if (response.ok) {
          btn.textContent             = 'Solicitud enviada';
          btn.style.backgroundColor   = '#666';
          showSuccess('Invitación enviada correctamente');
        } else {
          btn.disabled    = false;
          btn.textContent = 'Añadir amigo';
          const data = await response.json();
          showError(data.error ?? 'No se pudo enviar la invitación');
        }
      } catch {
        btn.disabled    = false;
        btn.textContent = 'Añadir amigo';
        showError('Error de conexión con el servidor');
      }
    }

    // ── SOLICITUDES PENDIENTES ────────────────────────────────
    async function loadRequests() {
      if (!email) return;
      try {
        const response = await fetch(
          `http://localhost:8080/api/invitations/pendientes?email=${encodeURIComponent(email)}`
        );
        if (!response.ok) return;
        renderRequests(await response.json());
      } catch { /* silencioso */ }
    }

    function renderRequests(requests) {
      const grid = document.getElementById('requests-grid');
      if (!requests.length) {
        grid.innerHTML = '<p class="empty-text">No tienes solicitudes pendientes.</p>';
        return;
      }
      grid.innerHTML = '';
      requests.forEach(req => {
        const card = document.createElement('div');
        card.className = 'request-card';
        card.innerHTML = `
          <span style="font-weight:500; font-size:14px;">${req.senderName}</span>
          <div>
            <button class="btn btn-success btn-sm me-1"
              onclick="respondRequest(${req.id}, 'accept', this)">Aceptar</button>
            <button class="btn btn-outline-danger btn-sm"
              onclick="respondRequest(${req.id}, 'reject', this)">Rechazar</button>
          </div>`;
        grid.appendChild(card);
      });
    }

    async function respondRequest(requestId, action, btn) {
      try {
        btn.disabled    = true;
        const response  = await fetch(
          `http://localhost:8080/api/invitations/${action}/${requestId}`,
          { method: 'POST', headers: { 'Content-Type': 'application/json' } }
        );
        if (response.ok) {
          showSuccess(action === 'accept' ? 'Solicitud aceptada' : 'Solicitud rechazada');
          loadRequests();
          if (action === 'accept') loadFriends();
        } else {
          btn.disabled = false;
          showError('No se pudo procesar la solicitud');
        }
      } catch {
        btn.disabled = false;
        showError('Error de conexión con el servidor');
      }
    }

    // ── AMIGOS ────────────────────────────────────────────────
    async function loadFriends() {
      if (!email) return;
      try {
        const response = await fetch(
          `http://localhost:8080/api/invitations/amigos?email=${encodeURIComponent(email)}`,
        );
        if (!response.ok) return;
        renderFriends(await response.json());
      } catch { /* silencioso */ }
    }

    function renderFriends(friends) {
      const grid = document.getElementById('friends-grid');
      if (!friends.length) {
        grid.innerHTML = '<p class="empty-text">No tienes amigos añadidos aún.</p>';
        return;
      }
      grid.innerHTML = '';
      friends.forEach(f => {
        const card = document.createElement('div');
        card.className = 'friend-card';
        card.innerHTML = `
          <span style="font-weight:500; font-size:14px;">${f.name}</span>
          <button class="btn-remove-friend"
            onclick="removeFriend(${f.invitationId}, this)">Eliminar</button>`;
        grid.appendChild(card);
      });
    }

    async function removeFriend(invitationId, btn) {
      if (!confirm('¿Eliminar este amigo?')) return;
      try {
        btn.disabled = true;
        const response = await fetch(
          `http://localhost:8080/api/invitations/deleteById/${invitationId}`,
          { method: 'DELETE' }
        );
        if (response.ok) {
          showSuccess('Amigo eliminado');
          loadFriends();
        } else {
          btn.disabled = false;
          showError('No se pudo eliminar');
        }
      } catch {
        btn.disabled = false;
        showError('Error de conexión con el servidor');
      }
    }

    // ── BÚSQUEDA ──────────────────────────────────────────────
    document.getElementById('search-form').addEventListener('submit', function(e) {
      e.preventDefault();
      loadUsers(document.getElementById('searchText').value.trim());
    });

    // ── INIT ──────────────────────────────────────────────────
    loadUsers();
    loadRequests();
    loadFriends();
  </script>

</body>
</html>
