<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedSocial</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>

<div class="container">

  <div class="left">
    <h2 class="card-title">RedSocial</h2>
    <div class="card custom-card">
      <img src="assets/images/image.png" class="card-img-fill">
    </div>
  </div>

  <div class="right">
    <div class="login-box">
      
      <h2>Bienvenido</h2>
      <p>Inicia sesión para continuar</p>

      <form action="/login" method="post">
        <label>Correo electrónico</label>
        <input type="text" name="username" placeholder="tuemail@ejemplo.com">

        <label>Contraseña</label>
        <input type="password" name="password" placeholder="••••••••">

        <a href="/restore" class="forgot">¿Olvidaste tu contraseña?</a>

        <button type="submit">Iniciar sesión</button>
      </form>

      <div class="restaurar"> 
        <p>No tienes una cuenta? <a class="restaurar-link" href="/signup">Regístrate aquí</a></p>
      </div>

    </div>
  </div>

</div>

</body>
</html>
