<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedSocial</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>

<div class="container">
  <div class="left">
    <h2 class="card-title">RedSocial</h2>
    <div class="card custom-card">
      <img src="assets/images/image.png" class="card-img-fill">
    </div>
  </div>

  <div class="right">
    <div class="login-box">
      <h2>Bienvenido</h2>
      <p>Inicia sesión para continuar</p>

      <div id="error-msg" style="color:red; display:none;"></div>

      <form id="login-form">
        <label>Correo electrónico</label>
        <input type="text" id="email" placeholder="tuemail@ejemplo.com">

        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">

        <a href="restore.html" class="forgot">¿Olvidaste tu contraseña?</a>

        <button type="submit">Iniciar sesión</button>
      </form>

      <div class="restaurar">
        <p>No tienes una cuenta?
          <a href="register.html" class="restaurar-link">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');

    errorMsg.style.display = 'none';

    try {
      const response = await fetch('https://redsocial-back-cnns.onrender.com/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

     if (response.ok) {
    localStorage.setItem('user', JSON.stringify(data));
    localStorage.setItem('email', data.email);
    localStorage.setItem('me', data.auth);
    window.location.href = 'profile.html';
}else {
        errorMsg.style.display = 'block';
        errorMsg.textContent = data.error || 'Credenciales incorrectas';
      }

    } catch (error) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = 'Error de conexión con el servidor';
    }
  });
</script>

</body>
</html>
