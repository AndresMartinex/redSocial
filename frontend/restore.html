<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/restore.css">
    <title>Restaurar cuenta</title>
</head>
<body>
    <div class="restore-box">

        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="6" r="3" fill="#185fa5"/>
                <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
        </div>

        <h2>Restauración de cuenta</h2>
        <p>Ingresa tu correo electrónico y te enviaremos un enlace para recuperar el acceso.</p>

        <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tuemail@ejemplo.com">
        </div>

        <div id="mensaje" class="mensaje hidden"></div>

        <button class="btn-primary" onclick="enviarCorreo()">Restaurar cuenta</button>
        <a href="login.html" class="back-link">← Volver al inicio de sesión</a>

    </div>

    <script>
        async function enviarCorreo() {
            const email = document.getElementById('email').value.trim();
            const mensaje = document.getElementById('mensaje');
            const btn = document.querySelector('.btn-primary');

            if (!email) {
                mostrarMensaje('Por favor ingresa tu correo.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const response = await fetch('http://localhost:8080/api/password/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const text = await response.text();
                mostrarMensaje(text, 'exito');
            } catch (error) {
                mostrarMensaje('Error al conectar con el servidor.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Restaurar cuenta';
            }
        }

        function mostrarMensaje(texto, tipo) {
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = texto;
            mensaje.className = 'mensaje ' + tipo;
        }
    </script>
</body>
</html>
