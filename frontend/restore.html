<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/restore.css">

    <title>RedSocial</title>
</head>
<body >
   <div class="restore-box">

    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="6" r="3" fill="#185fa5"/>
        <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <h2>Restauración de cuenta</h2>
    <p>Ingresa tu correo electrónico y te enviaremos un enlace para recuperar el acceso.</p>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="tuemail@ejemplo.com">
    </div>

    <button class="btn-primary">Restaurar cuenta</button>
    <a href="login.html" class="back-link">← Volver al inicio de sesión</a>

  </div>
</body>
</html>
