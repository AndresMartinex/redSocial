<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/restore.css">
    <title>Nueva contraseña</title>
</head>
<body>
    <div class="restore-box">

        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="6" r="3" fill="#185fa5"/>
                <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
        </div>

        <h2>Nueva contraseña</h2>
        <p>Ingresa y confirma tu nueva contraseña para recuperar el acceso.</p>

        <div id="token-invalido" class="mensaje error hidden">
            El enlace es inválido o ha expirado. <a href="restore.html">Solicita uno nuevo</a>.
        </div>

        <div id="formulario">
            <div class="field">
                <label for="newPassword">Nueva contraseña</label>
                <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="field">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña">
            </div>

            <div id="mensaje" class="mensaje hidden"></div>

            <button class="btn-primary" onclick="cambiarContrasena()">Guardar contraseña</button>
        </div>

        <a href="login.html" class="back-link">← Volver al inicio de sesión</a>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!token) {
                mostrarTokenInvalido();
                return;
            }

            try {
                const response = await fetch(`https://redsocial-back-cnns.onrender.com/api/password/validate-token?token=${token}`);
                if (!response.ok) mostrarTokenInvalido();
            } catch (error) {
                mostrarTokenInvalido();
            }
        });

        async function cambiarContrasena() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.querySelector('.btn-primary');

            if (!newPassword || !confirmPassword) {
                mostrarMensaje('Completa todos los campos.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                mostrarMensaje('Las contraseñas no coinciden.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                const response = await fetch('https://redsocial-back-cnns.onrender.com/api/password/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword, confirmPassword })
                });

                const text = await response.text();

                if (response.ok) {
                    mostrarMensaje(text, 'exito');
                    document.getElementById('formulario').style.display = 'none';
                    setTimeout(() => window.location.href = 'login.html', 2500);
                } else {
                    mostrarMensaje(text, 'error');
                }
            } catch (error) {
                mostrarMensaje('Error al conectar con el servidor.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Guardar contraseña';
            }
        }

        function mostrarTokenInvalido() {
            document.getElementById('token-invalido').classList.remove('hidden');
            document.getElementById('formulario').style.display = 'none';
        }

        function mostrarMensaje(texto, tipo) {
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = texto;
            mensaje.className = 'mensaje ' + tipo;
        }
    </script>
</body>
</html>
