<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedSocial</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">RedSocial</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="UserList.html">Añadir amigos</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Más</a>
            <ul class="dropdown-menu">
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="cerrarSesion()">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex gap-2" role="search">
          <input class="form-control" type="search" placeholder="Buscar...">
          <button class="btn-search" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- HEADER DE PERFIL -->
    <div class="profile-header">
      <div>
        <div class="avatar-wrap">
          <div class="avatar-circle">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
              <circle cx="18" cy="13" r="6" fill="#185fa5"/>
              <path d="M6 30c0-6.627 5.373-12 12-12s12 5.373 12 12"
                    stroke="#185fa5" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="profile-info">
        <h2 id="profile-name">Cargando...</h2>
        <p class="username" id="profile-username">@usuario</p>
        <p id="profile-email" style="font-size:13px; color:#888;"></p>
        <div class="profile-stats">
          <span><strong>0</strong> publicaciones</span>
          <span><strong>0</strong> seguidores</span>
          <span><strong>0</strong> siguiendo</span>
        </div>
        <p class="profile-bio" id="profile-bio"></p>

        <button type="button" class="btn-edit"
                onclick="document.getElementById('modalEditarPerfil').style.display='flex'">
          Editar perfil
        </button>
      </div>
    </div>

    <!-- FORMULARIO CREAR POST -->
    <div class="create-card" id="createCard">
      <form id="post-form">
        <div class="create-header">
          <div class="mini-avatar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="6" r="3" fill="#185fa5"/>
              <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6"
                    stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <textarea name="contenido" id="postContenido" rows="2"
            placeholder="¿Qué estás pensando?"></textarea>
        </div>

        <div class="img-preview-wrap" id="imgPreviewWrap">
          <img id="imgPreview" alt="preview">
        </div>

        <div class="create-footer">
          <div class="create-tools">
            <button type="button" class="tool-btn">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
                <circle cx="5.5" cy="6.5" r="1.2" stroke="currentColor" stroke-width="1.2" fill="none"/>
                <path d="M1 11l3.5-3 3 3 2.5-2 3 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>
              </svg>
              Foto
            </button>
          </div>
          <button type="submit" class="btn-publish">Publicar</button>
        </div>

        <input type="file" id="postImgInput" name="imagen" accept="image/*">
      </form>
    </div>

    <!-- PUBLICACIONES -->
    <div class="empty-state" id="empty-state">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect x="4" y="8" width="32" height="24" rx="3" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
        <circle cx="14" cy="17" r="3" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
        <path d="M4 28l8-7 6 6 5-4 9 7" stroke="#b4b2a9" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <p>Aún no hay publicaciones</p>
      <span>Comparte tu primera foto o pensamiento</span>
    </div>

    <div class="posts-feed" id="posts-feed"></div>

  </div>

  <!-- MODAL EDITAR PERFIL -->
  <div id="modalEditarPerfil"
       style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);
              z-index:9999; align-items:center; justify-content:center;">

    <div style="background:white; border-radius:12px; padding:1.5rem;
                width:100%; max-width:440px; margin:1rem; max-height:90vh; overflow-y:auto;">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
        <h5 style="margin:0; font-weight:500; font-size:16px;">Editar perfil</h5>
        <button type="button"
                onclick="document.getElementById('modalEditarPerfil').style.display='none'"
                style="background:none; border:none; cursor:pointer; font-size:20px; color:#888; line-height:1;">
          ✕
        </button>
      </div>

      <form id="edit-form">

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Nombre</label>
          <input type="text" id="edit-name" name="name" class="form-control" placeholder="Tu nombre">
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Apellido</label>
          <input type="text" id="edit-lastName" name="lastName" class="form-control" placeholder="Tu apellido">
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Nombre de usuario</label>
          <input type="text" id="edit-username" name="username" class="form-control" placeholder="@usuario">
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Correo electrónico</label>
          <input type="email" id="edit-email" name="email" class="form-control" placeholder="correo@ejemplo.com">
        </div>

        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:1rem;">
          <button type="button" class="btn btn-secondary btn-sm"
                  onclick="document.getElementById('modalEditarPerfil').style.display='none'">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary btn-sm">Guardar cambios</button>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const userData = JSON.parse(localStorage.getItem('user'));

    // Redirigir si no hay sesión
    if (!userData || !userData.email) {
      window.location.href = 'login.html';
    }

    // Cargar datos del perfil
    async function cargarPerfil() {
      try {
        const response = await fetch(`http://localhost:8080/api/auth/me?email=${userData.email}`);
        const data = await response.json();

        document.getElementById('profile-name').textContent = data.name + ' ' + data.lastName;
        document.getElementById('profile-username').textContent = '@' + data.username;
        document.getElementById('profile-email').textContent = data.email;

        // Prellenar modal de edición
        document.getElementById('edit-name').value = data.name;
        document.getElementById('edit-lastName').value = data.lastName;
        document.getElementById('edit-username').value = data.username;
        document.getElementById('edit-email').value = data.email;

      } catch (error) {
        console.error('Error al cargar el perfil:', error);
      }
    }

    // Cerrar sesión
    function cerrarSesion() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    cargarPerfil();
  </script>

</body>
</html>
