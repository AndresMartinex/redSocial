<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedSocial</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">RedSocial</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>
         <li class="nav-item">
  <a class="nav-link" href="UserList.html">Añadir amigos</a>
</li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Más</a>
            <ul class="dropdown-menu">
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="login.html">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex gap-2" th:action="@{/buscar}" role="search" method="get">
          <input class="form-control" type="search" name="q" placeholder="Buscar...">
          <button class="btn-search" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- HEADER DE PERFIL -->
    <div class="profile-header">
      <div>
        <div class="avatar-wrap">
          <div class="avatar-circle">
            <img th:if="${usuario.fotoPerfil != null}"
                 th:src="@{'/uploads/' + ${usuario.fotoPerfil}}"
                 alt="Foto de perfil">
            <svg th:if="${usuario.fotoPerfil == null}"
                 width="36" height="36" viewBox="0 0 36 36" fill="none">
              <circle cx="18" cy="13" r="6" fill="#185fa5"/>
              <path d="M6 30c0-6.627 5.373-12 12-12s12 5.373 12 12"
                    stroke="#185fa5" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <a th:if="${esPropietario}" th:href="@{/perfil/foto}" class="avatar-overlay">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M2 9.5V11h1.5l4.4-4.4-1.5-1.5L2 9.5zM10.7 4.3a.4.4 0 000-.57L9.27 2.3a.4.4 0 00-.57 0l-1.1 1.1 1.5 1.5 1.6-1.6z" fill="white"/>
            </svg>
          </a>
        </div>
        <span class="avatar-hint" th:if="${esPropietario}">Subir foto</span>
      </div>

      <div class="profile-info">
        <h2 th:text="${usuario.nombre + ' ' + usuario.apellido}">Nombre Apellido</h2>
        <p class="username" th:text="'@' + ${usuario.username}">@nombreusuario</p>
        <div class="profile-stats">
          <span><strong th:text="${usuario.totalPublicaciones}">0</strong> publicaciones</span>
          <span><strong th:text="${usuario.totalSeguidores}">0</strong> seguidores</span>
          <span><strong th:text="${usuario.totalSiguiendo}">0</strong> siguiendo</span>
        </div>
        <p class="profile-bio" th:text="${usuario.biografia}">Biografía.</p>

        <!-- Botón que abre el modal (reemplaza el <a> anterior) -->
        <button th:if="${esPropietario}"
                type="button"
                class="btn-edit"
                onclick="document.getElementById('modalEditarPerfil').style.display='flex'">
          Editar perfil
        </button>
      </div>
    </div>

    <!-- ===================== -->
    <!-- FORMULARIO CREAR POST -->
    <!-- ===================== -->
    <div th:if="${esPropietario}">
      <div class="create-card" id="createCard">
        <form th:action="@{/publicaciones/crear}" method="post" enctype="multipart/form-data">

          <div class="create-header">
            <div class="mini-avatar">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="6" r="3" fill="#185fa5"/>
                <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6"
                      stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
              </svg>
            </div>
            <textarea name="contenido" id="postContenido" rows="2"
              placeholder="¿Qué estás pensando?"></textarea>
          </div>

          <!-- Preview imagen -->
          <div class="img-preview-wrap" id="imgPreviewWrap">
            <img id="imgPreview" alt="preview">
          </div>

          <div class="create-footer">
            <div class="create-tools">
              <button type="button" class="tool-btn">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
                  <circle cx="5.5" cy="6.5" r="1.2" stroke="currentColor" stroke-width="1.2" fill="none"/>
                  <path d="M1 11l3.5-3 3 3 2.5-2 3 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>
                </svg>
                Foto
              </button>
            </div>
            <button type="submit" class="btn-publish">Publicar</button>
          </div>

          <input type="file" id="postImgInput" name="imagen" accept="image/*">
        </form>
      </div>
    </div>

    <!-- ===================== -->
    <!-- PUBLICACIONES         -->
    <!-- ===================== -->

    <!-- Sin publicaciones -->
    <div class="empty-state" th:if="${#lists.isEmpty(publicaciones)}">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect x="4" y="8" width="32" height="24" rx="3" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
        <circle cx="14" cy="17" r="3" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
        <path d="M4 28l8-7 6 6 5-4 9 7" stroke="#b4b2a9" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <p>Aún no hay publicaciones</p>
      <span th:if="${esPropietario}">Comparte tu primera foto o pensamiento</span>
    </div>

    <!-- Con publicaciones -->
    <div class="posts-feed" th:if="${not #lists.isEmpty(publicaciones)}">
      <div class="post-card" th:each="post : ${publicaciones}">

        <!-- Cabecera del post -->
        <div class="post-header">
          <div class="post-avatar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="6" r="3" fill="#185fa5"/>
              <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6"
                    stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <div class="post-meta">
            <span class="post-author" th:text="${usuario.nombre + ' ' + usuario.apellido}">Nombre</span>
            <span class="post-date" th:text="${#dates.format(post.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</span>
          </div>
          <!-- Botón eliminar solo si es el propietario -->
          <form th:if="${esPropietario}"
                th:action="@{/publicaciones/eliminar/{id}(id=${post.id})}"
                method="post" class="post-delete-form">
            <button type="submit" class="post-delete-btn" title="Eliminar publicación">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M1 1l11 11M12 1L1 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </form>
        </div>

        <!-- Contenido de texto -->
        <div class="post-body" th:if="${post.contenido != null and post.contenido != ''}">
          <p th:text="${post.contenido}">Contenido del post</p>
        </div>

        <!-- Imagen del post -->
        <div class="post-image" th:if="${post.containsImage}">
          <img th:src="@{'/fotossubidas/' + ${post.id} + '.jpg'}" alt="Imagen de la publicación">
        </div>

      </div>
    </div>

  </div><!-- /container -->


  <!-- ======================== -->
  <!-- MODAL EDITAR PERFIL      -->
  <!-- ======================== -->
  <div id="modalEditarPerfil"
       style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);
              z-index:9999; align-items:center; justify-content:center;">

    <div style="background:white; border-radius:12px; padding:1.5rem;
                width:100%; max-width:440px; margin:1rem; max-height:90vh; overflow-y:auto;">

      <!-- Cabecera del modal -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
        <h5 style="margin:0; font-weight:500; font-size:16px;">Editar perfil</h5>
        <button type="button"
                onclick="document.getElementById('modalEditarPerfil').style.display='none'"
                style="background:none; border:none; cursor:pointer; font-size:20px; color:#888; line-height:1;">
          ✕
        </button>
      </div>

      <!-- Formulario edición -->
      <form th:action="@{/perfil/editar}" method="post">

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Nombre</label>
          <input type="text"
                 name="nombre"
                 th:value="${usuario.nombre}"
                 class="form-control"
                 placeholder="Tu nombre" />
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Apellido</label>
          <input type="text"
                 name="apellido"
                 th:value="${usuario.apellido}"
                 class="form-control"
                 placeholder="Tu apellido" />
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Número de teléfono</label>
          <input type="tel"
                 name="telefono"
                 th:value="${usuario.telefono}"
                 class="form-control"
                 placeholder="+57 300 000 0000" />
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Correo electrónico</label>
          <input type="email"
                 name="email"
                 th:value="${usuario.email}"
                 class="form-control"
                 placeholder="correo@ejemplo.com" />
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:13px; color:#666;">Biografía</label>
          <textarea name="biografia"
                    class="form-control"
                    rows="3"
                    placeholder="Cuéntanos algo sobre ti..."
                    th:text="${usuario.biografia}"></textarea>
        </div>

        <!-- Botones -->
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:1rem;">
          <button type="button"
                  class="btn btn-secondary btn-sm"
                  onclick="document.getElementById('modalEditarPerfil').style.display='none'">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary btn-sm">
            Guardar cambios
          </button>
        </div>

      </form>
    </div>
  </div>


  <!-- Bootstrap JS -->
  

</body>
</html>
