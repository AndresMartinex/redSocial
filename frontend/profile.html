<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedSocial</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="profile.html">RedSocial</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="profile.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="UserList.html">Añadir amigos</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Más</a>
            <ul class="dropdown-menu">
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="login.html" onclick="cerrarSesion()">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex gap-2" role="search">
          <input class="form-control" type="search" placeholder="Buscar...">
          <button class="btn-search" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- HEADER DE PERFIL -->
    <div class="profile-header">
      <div>
        <div class="avatar-wrap">
          <div class="avatar-circle">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
              <circle cx="18" cy="13" r="6" fill="#185fa5"/>
              <path d="M6 30c0-6.627 5.373-12 12-12s12 5.373 12 12"
                    stroke="#185fa5" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="profile-info">
        <h2 id="profile-name">Cargando...</h2>
        <p class="username" id="profile-username">@usuario</p>
        <p class="profile-email" id="profile-email"></p>
        <div class="profile-stats">
          <span><strong id="stat-posts">0</strong> publicaciones</span>
          <span><strong id="stat-amigos">0</strong> amigos</span>
        </div>
        <p class="profile-bio" id="profile-bio"></p>
        
      </div>
    </div>

    <!-- TABS -->
    <div class="feed-tabs" id="feed-tabs">
      <button class="tab-btn active" id="tab-mis" onclick="switchTab('mis')">Mis publicaciones</button>
      <button class="tab-btn" id="tab-amigos" onclick="switchTab('amigos')">Publicaciones de amigos</button>
    </div>

    <!-- FORMULARIO CREAR POST -->
    <div class="create-card" id="createCard">
      <form id="post-form">
        <div class="create-header">
          <div class="mini-avatar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="6" r="3" fill="#185fa5"/>
              <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6"
                    stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <textarea name="contenido" id="postContenido" rows="2"
            placeholder="¿Qué estás pensando?"></textarea>
        </div>

        <div class="img-preview-wrap" id="imgPreviewWrap">
          <img id="imgPreview" alt="preview">
          <button type="button" class="img-remove-btn" onclick="clearImage()">✕</button>
        </div>

        <div class="create-footer">
          <div class="create-tools">
            <button type="button" class="tool-btn" onclick="document.getElementById('postImgInput').click()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
                <circle cx="5.5" cy="6.5" r="1.2" stroke="currentColor" stroke-width="1.2" fill="none"/>
                <path d="M1 11l3.5-3 3 3 2.5-2 3 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/>
              </svg>
              Foto
            </button>
          </div>
          <button type="submit" class="btn-publish">Publicar</button>
        </div>

        <input type="file" id="postImgInput" name="imagen" accept="image/*">
      </form>
    </div>

    <!-- MENSAJES DE FEEDBACK -->
    <div id="error-msg" class="alert alert-danger mt-2 d-none"></div>
    <div id="success-msg" class="alert alert-success mt-2 d-none"></div>

    <!-- ESTADO VACÍO -->
    <div class="empty-state d-none" id="empty-state">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect x="4" y="8" width="32" height="24" rx="3" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
        <circle cx="14" cy="17" r="3" stroke="#b4b2a9" stroke-width="1.5" fill="none"/>
        <path d="M4 28l8-7 6 6 5-4 9 7" stroke="#b4b2a9" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <p id="empty-text">Aún no hay publicaciones</p>
      <span id="empty-sub">Comparte tu primera foto o pensamiento</span>
    </div>

    <!-- FEED DE PUBLICACIONES -->
    <div class="posts-feed" id="posts-feed"></div>

  </div>

  <!-- MODAL EDITAR PERFIL -->
  <div id="modalEditarPerfil" class="modal-overlay d-none">
    <div class="modal-box">
      <div class="modal-header-row">
        <h5 class="modal-title-text">Editar perfil</h5>
        <button type="button" class="modal-close-btn"
                onclick="document.getElementById('modalEditarPerfil').classList.add('d-none')">✕</button>
      </div>
      <form id="edit-form">
        <div class="mb-3">
          <label class="form-label label-sm">Nombre</label>
          <input type="text" id="edit-name" name="name" class="form-control" placeholder="Tu nombre">
        </div>
        <div class="mb-3">
          <label class="form-label label-sm">Apellido</label>
          <input type="text" id="edit-lastName" name="lastName" class="form-control" placeholder="Tu apellido">
        </div>
        <div class="mb-3">
          <label class="form-label label-sm">Nombre de usuario</label>
          <input type="text" id="edit-username" name="username" class="form-control" placeholder="@usuario">
        </div>
        <div class="mb-3">
          <label class="form-label label-sm">Correo electrónico</label>
          <input type="email" id="edit-email" name="email" class="form-control" placeholder="correo@ejemplo.com">
        </div>
        <div class="modal-footer-row">
          <button type="button" class="btn btn-secondary btn-sm"
                  onclick="document.getElementById('modalEditarPerfil').classList.add('d-none')">Cancelar</button>
          <button type="submit" class="btn btn-primary btn-sm">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EDITAR POST -->
  <div id="modalEditarPost" class="modal-overlay d-none">
    <div class="modal-box">
      <div class="modal-header-row">
        <h5 class="modal-title-text">Editar publicación</h5>
        <button type="button" class="modal-close-btn" onclick="cerrarModalEditar()">✕</button>
      </div>
      <textarea id="edit-post-content" class="form-control mb-3" rows="4"
                placeholder="¿Qué estás pensando?"></textarea>
      <div class="modal-footer-row">
        <button type="button" class="btn btn-secondary btn-sm" onclick="cerrarModalEditar()">Cancelar</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="guardarEdicionPost()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const userData = JSON.parse(localStorage.getItem('user'));
    if (!userData || !userData.email) window.location.href = 'login.html';

    const email  = userData.email;
    const userId = userData.id;
    let tabActual = 'mis';
    let postEditandoId = null;
    let imagenBase64 = null;

    // ── HELPERS ───────────────────────────────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('d-none');
      setTimeout(() => el.classList.add('d-none'), 3000);
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.classList.remove('d-none');
      setTimeout(() => el.classList.add('d-none'), 3000);
    }

    // ── PERFIL ────────────────────────────────────────────────────────────────
    async function cargarPerfil() {
      try {
        const [perfilRes, amigosRes] = await Promise.all([
          fetch(`https://redsocial-back-cnns.onrender.com/api/auth/me?email=${email}`),
          fetch(`https://redsocial-back-cnns.onrender.com/api/invitations/amigos?email=${encodeURIComponent(email)}`)
        ]);
        const perfil = await perfilRes.json();
        const amigos = amigosRes.ok ? await amigosRes.json() : [];

        document.getElementById('profile-name').textContent     = perfil.name + ' ' + perfil.lastName;
        document.getElementById('profile-username').textContent = '@' + perfil.username;
        document.getElementById('profile-email').textContent    = perfil.email;
        document.getElementById('stat-amigos').textContent      = amigos.length;

        document.getElementById('edit-name').value     = perfil.name;
        document.getElementById('edit-lastName').value = perfil.lastName;
        document.getElementById('edit-username').value = perfil.username;
        document.getElementById('edit-email').value    = perfil.email;
      } catch (e) {
        console.error('Error al cargar el perfil:', e);
      }
    }

    // ── TABS ──────────────────────────────────────────────────────────────────
    function switchTab(tab) {
      tabActual = tab;
      document.getElementById('tab-mis').classList.toggle('active', tab === 'mis');
      document.getElementById('tab-amigos').classList.toggle('active', tab === 'amigos');
      document.getElementById('createCard').style.display = tab === 'mis' ? 'block' : 'none';

      if (tab === 'mis') {
        document.getElementById('empty-text').textContent = 'Aún no hay publicaciones';
        document.getElementById('empty-sub').textContent  = 'Comparte tu primera foto o pensamiento';
        cargarMisPublicaciones();
      } else {
        document.getElementById('empty-text').textContent = 'Tus amigos no han publicado nada aún';
        document.getElementById('empty-sub').textContent  = 'Cuando publiquen, aparecerá aquí';
        cargarPublicacionesAmigos();
      }
    }

    // ── MIS PUBLICACIONES ─────────────────────────────────────────────────────
    async function cargarMisPublicaciones() {
      try {
        const res   = await fetch(`https://redsocial-back-cnns.onrender.com/api/posts/misPublicaciones?email=${encodeURIComponent(email)}`);
        const posts = await res.json();
        document.getElementById('stat-posts').textContent = posts.length;
        renderPosts(posts, true);
      } catch (e) { console.error(e); }
    }

    // ── PUBLICACIONES DE AMIGOS ───────────────────────────────────────────────
    async function cargarPublicacionesAmigos() {
      try {
        const res   = await fetch(`https://redsocial-back-cnns.onrender.com/api/posts/amigos?email=${encodeURIComponent(email)}`);
        const posts = await res.json();
        renderPosts(posts, false);
      } catch (e) { console.error(e); }
    }

    // ── RENDER POSTS ──────────────────────────────────────────────────────────
    function renderPosts(posts, esMio) {
      const feed       = document.getElementById('posts-feed');
      const emptyState = document.getElementById('empty-state');
      feed.innerHTML   = '';

      if (!posts.length) {
        emptyState.classList.remove('d-none');
        return;
      }
      emptyState.classList.add('d-none');

      posts.forEach(post => {
        const card = document.createElement('div');
        card.className  = 'post-card';
        card.dataset.id = post.id;

        const fecha = new Date(post.createdAt).toLocaleDateString('es-CO', {
          day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        card.innerHTML = `
          <div class="post-header">
            <div class="post-avatar">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="6" r="3" fill="#185fa5"/>
                <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6"
                      stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
              </svg>
            </div>
            <div>
              <span class="post-author">${esMio ? 'Tú' : 'Amigo'}</span>
              <span class="post-date">${fecha}</span>
            </div>
            ${esMio ? `
            <div class="post-actions">
              <button class="post-action-btn" onclick="abrirModalEditar(${post.id}, \`${(post.content || '').replace(/`/g, '\\`')}\`)">✏️</button>
              <button class="post-action-btn" onclick="eliminarPost(${post.id})">🗑️</button>
            </div>` : ''}
          </div>
          ${post.content ? `<p class="post-content">${post.content}</p>` : ''}
          ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="imagen del post">` : ''}
          <div class="post-comments" id="comments-${post.id}">
            <div class="comments-list" id="comments-list-${post.id}"></div>
            <div class="comment-form">
              <input type="text" id="comment-input-${post.id}"
                     placeholder="Escribe un comentario..."
                     class="comment-input"
                     onkeydown="if(event.key==='Enter') enviarComentario(${post.id})">
              <button class="comment-send-btn" onclick="enviarComentario(${post.id})">Enviar</button>
            </div>
          </div>`;

        feed.appendChild(card);
        cargarComentarios(post.id);
      });
    }

    // ── CREAR POST ────────────────────────────────────────────────────────────
    document.getElementById('post-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const content = document.getElementById('postContenido').value.trim();
      if (!content && !imagenBase64) { showError('Escribe algo o sube una imagen'); return; }

      try {
        const res = await fetch('https://redsocial-back-cnns.onrender.com/api/posts/crear', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ userId, content, imageUrl: imagenBase64 })
        });
        if (res.ok) {
          document.getElementById('postContenido').value = '';
          clearImage();
          showSuccess('Publicación creada');
          cargarMisPublicaciones();
        } else {
          showError('No se pudo crear la publicación');
        }
      } catch { showError('Error de conexión'); }
    });

    // ── IMAGEN PREVIEW ────────────────────────────────────────────────────────
    document.getElementById('postImgInput').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        imagenBase64 = e.target.result;
        document.getElementById('imgPreview').src = imagenBase64;
        document.getElementById('imgPreviewWrap').style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    function clearImage() {
      imagenBase64 = null;
      document.getElementById('postImgInput').value = '';
      document.getElementById('imgPreview').src = '';
      document.getElementById('imgPreviewWrap').style.display = 'none';
    }

    // ── EDITAR POST ───────────────────────────────────────────────────────────
    function abrirModalEditar(id, content) {
      postEditandoId = id;
      document.getElementById('edit-post-content').value = content;
      document.getElementById('modalEditarPost').classList.remove('d-none');
    }

    function cerrarModalEditar() {
      postEditandoId = null;
      document.getElementById('modalEditarPost').classList.add('d-none');
    }

    async function guardarEdicionPost() {
      const content = document.getElementById('edit-post-content').value.trim();
      if (!content) { showError('El contenido no puede estar vacío'); return; }
      try {
        const res = await fetch(`https://redsocial-back-cnns.onrender.com/api/posts/editar/${postEditandoId}`, {
          method:  'PUT',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ userId, content })
        });
        if (res.ok) {
          cerrarModalEditar();
          showSuccess('Publicación actualizada');
          cargarMisPublicaciones();
        } else {
          showError('No se pudo actualizar');
        }
      } catch { showError('Error de conexión'); }
    }

    // ── ELIMINAR POST ─────────────────────────────────────────────────────────
    async function eliminarPost(id) {
      if (!confirm('¿Eliminar esta publicación?')) return;
      try {
        const res = await fetch(`https://redsocial-back-cnns.onrender.com/api/posts/deleteById/${id}`, { method: 'DELETE' });
        if (res.ok) {
          showSuccess('Publicación eliminada');
          cargarMisPublicaciones();
        } else {
          showError('No se pudo eliminar');
        }
      } catch { showError('Error de conexión'); }
    }

    // ── COMENTARIOS ───────────────────────────────────────────────────────────
    async function cargarComentarios(postId) {
      try {
        const res      = await fetch(`https://redsocial-back-cnns.onrender.com/api/comments/post/${postId}`);
        const comments = await res.json();
        const list     = document.getElementById(`comments-list-${postId}`);
        if (!list) return;
        list.innerHTML = '';
        comments.forEach(c => {
          const div = document.createElement('div');
          div.className = 'comment-item';
          div.innerHTML = `
            <span class="comment-text">${c.content}</span>
            ${c.userId === userId
              ? `<button class="comment-delete-btn" onclick="eliminarComentario(${c.id}, ${postId})">✕</button>`
              : ''}`;
          list.appendChild(div);
        });
      } catch (e) { console.error(e); }
    }

    async function enviarComentario(postId) {
      const input   = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      if (!content) return;
      try {
        const res = await fetch('https://redsocial-back-cnns.onrender.com/api/comments/crear', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ postId, userId, content })
        });
        if (res.ok) {
          input.value = '';
          cargarComentarios(postId);
        }
      } catch (e) { console.error(e); }
    }

    async function eliminarComentario(commentId, postId) {
      try {
        const res = await fetch(`https://redsocial-back-cnns.onrender.com/api/comments/deleteById/${commentId}`, { method: 'DELETE' });
        if (res.ok) cargarComentarios(postId);
      } catch (e) { console.error(e); }
    }

    // ── CERRAR SESIÓN ─────────────────────────────────────────────────────────
    function cerrarSesion() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    // ── INIT ──────────────────────────────────────────────────────────────────
    cargarPerfil();
    cargarMisPublicaciones();
  </script>

</body>
</html>
